<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hattrick Player Renderer — Studio</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --panel: #fff;
        --line: #d9dde3;
        --ink: #1b1f24;
        --muted: #6b7280;
        --accent: #2f6f4f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15181c;
          --panel: #1e2228;
          --line: #2c313a;
          --ink: #e9edf2;
          --muted: #9aa3af;
          --accent: #5fbf8c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0;
        font-size: 18px;
      }
      header p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      main {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 20px;
        padding: 20px;
        align-items: start;
      }
      @media (max-width: 720px) {
        main {
          grid-template-columns: 1fr;
        }
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-size: 13px;
        color: var(--muted);
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
      }
      textarea {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        min-height: 84px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .swatches {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 6px;
        margin-top: 4px;
      }
      .swatch {
        aspect-ratio: 1;
        border-radius: 6px;
        border: 2px solid transparent;
        cursor: pointer;
        padding: 0;
        margin: 0;
      }
      .swatch[aria-pressed="true"] {
        border-color: var(--ink);
        box-shadow:
          0 0 0 2px var(--panel),
          0 0 0 4px var(--accent);
      }
      .toggle {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-top: 4px;
      }
      .toggle button {
        margin: 0;
        padding: 7px;
        background: var(--bg);
        color: var(--ink);
        border: 1px solid var(--line);
        font-weight: 500;
      }
      .toggle button[aria-pressed="true"] {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      details {
        margin-top: 14px;
      }
      details > summary {
        cursor: pointer;
        font-size: 13px;
        color: var(--muted);
      }
      .picker {
        display: grid;
        gap: 8px;
        margin-top: 6px;
      }
      .stepper {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        background: var(--bg);
      }
      .stepper-head {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .stepper-idx {
        font-variant-numeric: tabular-nums;
      }
      .stepper-row {
        display: grid;
        grid-template-columns: 32px 1fr 32px;
        align-items: center;
        gap: 8px;
      }
      .arrow {
        margin: 0;
        width: 32px;
        height: 48px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--ink);
        font-size: 13px;
        line-height: 1;
      }
      .arrow:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .thumb {
        height: 56px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background:
          repeating-conic-gradient(
            #0000 0 25%,
            color-mix(in srgb, var(--line) 60%, transparent) 0 50%
          )
          0 0 / 12px 12px;
      }
      .thumb img {
        max-height: 52px;
        max-width: 100%;
        width: auto;
        image-rendering: auto;
      }
      .thumb.empty::after {
        content: "none";
        font-size: 12px;
        color: var(--muted);
      }
      button {
        margin-top: 14px;
        width: 100%;
        padding: 9px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--accent);
      }
      #stage {
        min-height: 440px;
        display: grid;
        place-items: center;
        background: repeating-conic-gradient(
            #0000 0 25%,
            color-mix(in srgb, var(--line) 50%, transparent) 0 50%
          )
          0 0 / 24px 24px;
        border-radius: 10px;
      }
      #status {
        margin-top: 10px;
        font-size: 13px;
        color: var(--muted);
        min-height: 18px;
      }
      code {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Player Renderer — Studio</h1>
      <p>
        Design a player and export the figure. Runs entirely on vendored assets — no Hattrick at
        runtime (run <code>pnpm --filter hattrick-player-renderer fetch-assets</code> first). Every
        change renders immediately.
      </p>
    </header>
    <main>
      <div id="controls" class="panel">
        <label>Gender</label>
        <div id="genderToggle" class="toggle">
          <button type="button" data-gender="m" aria-pressed="true">Male</button>
          <button type="button" data-gender="f" aria-pressed="false">Female</button>
        </div>

        <label>Skin tone (sets face variant + body colour)</label>
        <div id="skinSwatches" class="swatches"></div>

        <label>Parts</label>
        <div id="facePicker" class="picker"></div>

        <details>
          <summary>Body &amp; layout</summary>
          <label for="bodyType">Body type (1–12)</label>
          <select id="bodyType"></select>

          <label for="width">Width (px)</label>
          <input id="width" type="number" value="240" min="40" max="800" />

          <div class="row">
            <div>
              <label for="neckPosition">Neck position</label>
              <input id="neckPosition" type="number" value="87" />
            </div>
            <div>
              <label for="hairOffsetX">Hair offset X</label>
              <input id="hairOffsetX" type="number" value="0" />
            </div>
          </div>

          <label for="hairOffsetY">Hair offset Y</label>
          <input id="hairOffsetY" type="number" value="0" />

          <label for="kitJson">Kit JSON URL (optional)</label>
          <input id="kitJson" type="text" value="/sample-kit.json" />
        </details>

        <button id="exportBtn" type="button" class="secondary">Export PNG</button>
        <div id="status"></div>
      </div>

      <div id="stage" class="panel"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
