<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hattrick Player Renderer Studio</title>
  </head>
  <body>
    <header>
      <h1>Player Renderer</h1>
      <button
        id="menuToggle"
        type="button"
        class="menu-toggle"
        aria-label="Settings"
        aria-expanded="false"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <line x1="4" y1="7" x2="20" y2="7" />
          <line x1="4" y1="12" x2="20" y2="12" />
          <line x1="4" y1="17" x2="20" y2="17" />
        </svg>
      </button>
    </header>
    <main>
      <div id="backdrop" class="drawer-backdrop"></div>
      <div id="controls" class="panel">
        <div class="tabbar" role="tablist">
          <button type="button" class="tab-btn" data-tab="appearance">Appearance</button>
          <button type="button" class="tab-btn" data-tab="body">Body &amp; layout</button>
          <button type="button" class="tab-btn" data-tab="export">Export</button>
        </div>

        <div class="tab-panel" data-tab="appearance">
          <div class="section-body">
            <label>Gender</label>
            <div id="genderToggle" class="toggle">
              <button type="button" data-gender="m" aria-pressed="true">Male</button>
              <button type="button" data-gender="f" aria-pressed="false">Female</button>
            </div>

            <label>Skin tone (sets face variant + body colour)</label>
            <div id="skinSwatches" class="swatches"></div>

            <label>Parts</label>
            <button id="randomBtn" type="button" class="secondary">Randomize</button>
            <div id="facePicker" class="picker"></div>
          </div>
        </div>

        <div class="tab-panel" data-tab="body">
          <div class="section-body">
            <label for="bodyType">Body type (1-12)</label>
            <select id="bodyType"></select>

            <label for="width">Width (px)</label>
            <input id="width" type="number" value="240" min="40" max="800" />

            <div class="row">
              <div>
                <label for="neckPosition">Neck position</label>
                <input id="neckPosition" type="number" value="87" />
              </div>
              <div>
                <label for="hairOffsetX">Hair offset X</label>
                <input id="hairOffsetX" type="number" value="0" />
              </div>
            </div>

            <label for="hairOffsetY">Hair offset Y</label>
            <input id="hairOffsetY" type="number" value="0" />

            <label for="kitJson">Kit JSON URL (optional)</label>
            <input id="kitJson" type="text" value="/default-kit.json" />
          </div>
        </div>

        <div class="tab-panel" data-tab="export">
          <div class="section-body">
            <button id="exportBtn" type="button" class="secondary">PNG</button>
            <div id="status"></div>
          </div>
        </div>
      </div>

      <div id="stage" class="panel"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
