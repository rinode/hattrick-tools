<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hattrick Team Photo</title>
  </head>
  <body>
    <header>
      <h1>Team Photo</h1>
      <p>Renders your squad into a team photo.</p>
    </header>
    <main>
      <form id="controls" class="panel">
        <div id="auth" style="margin-bottom: 12px"></div>
        <div id="roster">Loading roster</div>
        <label for="rows">Rows</label>
        <input id="rows" type="number" value="3" min="1" max="8" />
        <label for="maxPerRow">Max per row</label>
        <input id="maxPerRow" type="number" value="6" min="1" max="12" />
        <div class="check">
          <input id="stagger" type="checkbox" checked /><label for="stagger" style="margin: 0"
            >Stagger rows</label
          >
        </div>
        <button id="generateBtn" type="submit">Generate photo</button>
        <button id="exportBtn" type="button" class="secondary">Export PNG</button>
        <div id="status"></div>
      </form>
      <div id="stage" class="panel"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
