<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hattrick Team Photo</title>
  </head>
  <body>
    <header>
      <h1>Team Photo</h1>
      <p>Renders your squad into a team photo.</p>
    </header>
    <main>
      <div id="controls" class="panel">
        <div id="auth" style="margin-bottom: 12px"></div>

        <div id="teamPick" style="display: none">
          <label for="team">Team</label>
          <select id="team"></select>
        </div>

        <label>Squad <span id="teamName" class="team-name"></span></label>
        <div id="squad" class="squad"></div>

        <label for="bgFile">Background</label>
        <input id="bgFile" type="file" accept="image/*" />
        <button id="bgClear" type="button" class="secondary">Remove background</button>

        <label for="rows">Rows</label>
        <input id="rows" type="number" value="3" min="1" max="8" />
        <label for="maxPerRow">Max per row</label>
        <input id="maxPerRow" type="number" value="6" min="1" max="12" />
        <div class="check">
          <input id="stagger" type="checkbox" checked /><label for="stagger" style="margin: 0"
            >Stagger rows</label
          >
        </div>

        <button id="exportBtn" type="button">Export PNG</button>
        <div id="status"></div>
      </div>
      <div id="stage" class="panel"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
