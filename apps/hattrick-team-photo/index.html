<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hattrick Team Photo</title>
  </head>
  <body>
    <header>
      <h1>Team Photo</h1>
    </header>
    <main>
      <div id="controls" class="panel">
        <details class="section" open>
          <summary>Team &amp; squad</summary>
          <div class="section-body">
            <div id="auth" style="margin-bottom: 12px"></div>

            <div id="teamPick" style="display: none">
              <label for="team">Team</label>
              <select id="team"></select>
            </div>

            <label>Squad <span id="teamName" class="team-name"></span></label>
            <div id="squad" class="squad"></div>
          </div>
        </details>

        <details class="section" open>
          <summary>Layout</summary>
          <div class="section-body">
            <label for="rows">Rows</label>
            <div class="slider-row">
              <input id="rows" type="range" min="1" max="8" step="1" value="3" />
              <span id="rowsVal" class="slider-val">3</span>
            </div>

            <label for="stairH">Row height</label>
            <input id="stairH" type="range" min="20" max="90" step="1" value="25" />

            <div class="check">
              <input id="stagger" type="checkbox" checked /><label for="stagger" style="margin: 0"
                >Stagger rows</label
              >
            </div>
          </div>
        </details>

        <details class="section" open>
          <summary>Show / hide</summary>
          <div class="section-body">
            <div class="check">
              <input id="showName" type="checkbox" checked /><label for="showName" style="margin: 0"
                >Team name</label
              >
            </div>
            <div class="check">
              <input id="showCrest" type="checkbox" checked /><label for="showCrest" style="margin: 0"
                >Crest</label
              >
            </div>
            <div class="check">
              <input id="crestShadow" type="checkbox" /><label for="crestShadow" style="margin: 0"
                >Crest drop shadow</label
              >
            </div>
            <div class="check">
              <input id="showNames" type="checkbox" checked /><label for="showNames" style="margin: 0"
                >Player names</label
              >
            </div>
            <div class="check">
              <input id="showStairs" type="checkbox" checked /><label
                for="showStairs"
                style="margin: 0"
                >Stairs</label
              >
            </div>
          </div>
        </details>

        <details class="section" open>
          <summary>Text</summary>
          <div class="section-body">
            <label for="headerFont">Team name font</label>
            <div class="slider-row">
              <div class="combo">
                <input
                  id="headerFont"
                  class="combo-input"
                  value="Rosetta"
                  autocomplete="off"
                  spellcheck="false"
                />
                <div class="combo-list" hidden></div>
              </div>
              <input id="headerColor" type="color" value="#ffffff" class="swatch swatch-sm" />
            </div>
            <select id="headerStyle" class="font-style"></select>
            <div class="slider-row" style="margin-top: 6px">
              <input id="headerSize" type="range" min="28" max="80" step="1" value="52" />
              <span id="headerSizeVal" class="slider-val">52</span>
            </div>

            <label for="namesFont">Player names font</label>
            <div class="slider-row">
              <div class="combo">
                <input
                  id="namesFont"
                  class="combo-input"
                  value="Roboto"
                  autocomplete="off"
                  spellcheck="false"
                />
                <div class="combo-list" hidden></div>
              </div>
              <input id="namesColor" type="color" value="#ffffff" class="swatch swatch-sm" />
            </div>
            <select id="namesStyle" class="font-style"></select>
            <div class="slider-row" style="margin-top: 6px">
              <input id="namesSize" type="range" min="10" max="24" step="1" value="15" />
              <span id="namesSizeVal" class="slider-val">15</span>
            </div>

            <label for="fontUpload">Upload a font</label>
            <input id="fontUpload" type="file" accept=".ttf,.otf,.woff,.woff2" />
          </div>
        </details>

        <details class="section" open>
          <summary>Background</summary>
          <div class="section-body">
            <label for="bgColor">Colour</label>
            <input id="bgColor" type="color" value="#3f7137" class="swatch" />

            <label for="bgAlpha">Opacity</label>
            <div class="slider-row">
              <input id="bgAlpha" type="range" min="0" max="100" step="1" value="100" />
              <span id="bgAlphaVal" class="slider-val">100%</span>
            </div>

            <label for="bgFile">Image</label>
            <input id="bgFile" type="file" accept="image/*" />
            <button id="bgClear" type="button" class="secondary">Remove image</button>
          </div>
        </details>

        <button id="exportBtn" type="button">Export PNG</button>
        <div id="status"></div>
      </div>
      <div id="stage" class="panel"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
